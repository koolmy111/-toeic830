let S=JSON.parse(localStorage.getItem(KEY)||'null')||{day:1,xp:0,streak:0,completed:{},wrong:[],srs:{},stats:{total:0,correct:0,vocab:0,p2:0,p34:0,g:0,r:0,listen:0},mock:[],lastStudy:''};
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function c(){return S.completed[S.day]||(S.completed[S.day]={vocab:0,p2:0,p34:0,g:0,r:0,listen:0})}
function plan(){return P[S.day-1]}
function pct(){let x=c(),p=plan();return Math.round((Math.min(1,x.vocab/p.new_vocab)+Math.min(1,x.p2/p.p2)+Math.min(1,x.p34/p.p3p4)+Math.min(1,x.g/p.p5p6)+Math.min(1,x.r/p.p7)+Math.min(1,x.listen/p.listening))/6*100)}
function complete(){let x=c(),p=plan();if(x.vocab>=p.new_vocab&&x.p2>=p.p2&&x.p34>=p.p3p4&&x.g>=p.p5p6&&x.r>=p.p7&&x.listen>=p.listening&&!x.finished){x.finished=true;S.xp+=100;S.streak++;}save()}
function home(){
 let x=c(),p=plan(),pc=pct(),acc=S.stats.total?Math.round(S.stats.correct/S.stats.total*100):0;
 let ds='';for(let i=1;i<=90;i++)ds+=`<button class="day ${i==S.day?'current':''} ${S.completed[i]?.finished?'done':''}" onclick="jump(${i})">D${i}</button>`;
 document.getElementById('app').innerHTML=`<div class="card hero"><div class="row"><div><span class="pill">${p.phase}</span><h2 style="margin:7px 0">Day ${S.day}</h2><div>${p.focus}</div></div><div class="big">${pc}%</div></div><div class="progress"><div class="bar" style="width:${pc}%"></div></div><p class="small">今日目标：${p.new_vocab}新词 · P2 ${p.p2} · P3/4 ${p.p3p4} · P5/6 ${p.p5p6} · P7 ${p.p7} · 听力 ${p.listening}分钟</p></div>
 <div class="grid"><div class="stat"><small>完成天数</small><div class="big">${Object.values(S.completed).filter(z=>z.finished).length}/90</div></div><div class="stat"><small>综合正确率</small><div class="big">${acc}%</div></div><div class="stat"><small>连续天数</small><div class="big">${S.streak}</div></div><div class="stat"><small>错题</small><div class="big">${S.wrong.length}</div></div></div>
 <div class="card"><h3>今日入口</h3><button onclick="vocab()">📚 词汇</button><button onclick="practice()">✏️ 专项</button><button onclick="listen()">🎧 听力</button><button onclick="mock()">⏱️ 模拟</button>${S.completed[S.day]?.finished?`<button class="ok" onclick="nextDay()">进入 Day ${Math.min(90,S.day+1)}</button>`:''}</div>
 <div class="card"><h3>90天路线</h3><div class="days">${ds}</div></div>
 <div class="card"><h3>今日策略</h3><p>${p.mock?'⭐ 今天是检查点：先做 Mini Mock，再根据错题复盘。':'先完成新词 → P2/P3/4 → P5/6 → P7 → 听力；最后做 SRS。'}</p></div>`;
}
function jump(d){if(d>S.day&&!S.completed[S.day]?.finished)return alert('当前 Day 尚未完成。');S.day=d;save();home()}
function nextDay(){if(!S.completed[S.day]?.finished)return alert('请完成今天的全部任务。');S.day=Math.min(90,S.day+1);save();home()}
function vocab(){
 let a=W.filter(w=>w.day==S.day);if(!a.length)a=W.slice(0,20);a=a.slice(0,plan().new_vocab);let i=0;
 function draw(){let w=a[i];document.getElementById('app').innerHTML=`<div class="card"><span class="pill">新词 ${i+1}/${a.length}</span><div class="word">${w.word}</div><div id="mean" style="display:none;font-size:18px;margin:10px 0">${w.meaning}</div><p class="muted">${w.example||''}</p><button class="alt" onclick="mean.style.display='block'">显示释义</button><button onclick="speak('${w.word.replaceAll("'","")}')">🔊</button><hr><button class="ok" onclick="wordAns(1)">认识</button><button class="warn" onclick="wordAns(0)">不熟</button></div>`}
 window.wordAns=function(ok){let w=a[i],x=c();x.vocab++;S.stats.vocab++;S.stats.total++;if(ok)S.stats.correct++;else S.wrong.push({type:'vocab',id:w.id,day:S.day});S.srs[w.id]={next:Date.now()+(ok?3*86400000:3600000)};i++;save();if(i>=a.length){x.vocab=plan().new_vocab;complete();home()}else draw()};draw()
}
function speak(x){let u=new SpeechSynthesisUtterance(x);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
function practice(){
 document.getElementById('app').innerHTML=`<div class="card"><h2>专项训练</h2><p class="muted">可以反复刷，不影响 Day 完成。</p><button onclick="quiz(P2,'p2',plan().p2)">Part 2</button><button onclick="quiz(P34,'p34',plan().p3p4)">Part 3/4</button><button onclick="quiz(G,'g',plan().p5p6)">Part 5/6</button><button onclick="quiz(R,'r',plan().p7)">Part 7</button><button class="alt" onclick="srs()">SRS复习</button></div>`
}
function quiz(bank,type,n){
 let i=0,score=0;
 function draw(){let q=bank[(S.day*11+i)%bank.length];document.getElementById('app').innerHTML=`<div class="card"><span class="pill">${type}</span><p>${i+1}/${n}</p><div class="q">${q[0]}</div>${q[1].map((o,j)=>`<button class="opt" onclick="qans(${j})">${String.fromCharCode(65+j)}. ${o}</button>`).join('')} ${q[3]?`<p class="muted">解析：${q[3]}</p>`:''}</div>`}
 window.qans=function(j){let q=bank[(S.day*11+i)%bank.length];S.stats.total++;if(j==q[2]){score++;S.stats.correct++}else S.wrong.push({type,id:q[0],day:S.day});if(type!='p2')S.stats[type=='p34'?'p34':type]++;else S.stats.p2++;i++;save();if(i>=n){if(type=='p2')c().p2=plan().p2;if(type=='p34')c().p34=plan().p3p4;if(type=='g')c().g=plan().p5p6;if(type=='r')c().r=plan().p7;complete();document.getElementById('app').innerHTML=`<div class="card"><h2>专项完成</h2><div class="big">${score}/${n}</div><p>正确率 ${Math.round(score/n*100)}%</p><button onclick="practice()">继续</button><button class="alt" onclick="home()">首页</button></div>`}else draw()};draw()
}
function listen(){let x=c(),goal=plan().listening;document.getElementById('app').innerHTML=`<div class="card"><span class="pill">Listening</span><div class="timer">${x.listen}/${goal} min</div><p>用自己的 TOEIC 音频完成训练，再记录真实训练时间。建议：Part 2 跟读 + Part 3/4 精听 + 复述。</p>${[5,10,15,30].map(n=>`<button onclick="addListen(${n})">+${n}分钟</button>`).join('')}<p class="muted">不要只“播放”：至少有一部分要精听、跟读或听写。</p></div>`}
function addListen(n){c().listen=Math.min(plan().listening,c().listen+n);complete();home()}
function srs(){
 let a=W.filter(w=>S.srs[w.id]?.next<=Date.now()).slice(0,25);if(!a.length)return alert('目前没有到期的 SRS 词。');let i=0;
 function draw(){let w=a[i];document.getElementById('app').innerHTML=`<div class="card"><span class="pill">SRS ${i+1}/${a.length}</span><div class="word">${w.word}</div><div id="sm" style="display:none;font-size:18px;margin:10px">${w.meaning}</div><button class="alt" onclick="sm.style.display='block'">显示答案</button><hr><button class="ok" onclick="srsa(1)">记住</button><button class="warn" onclick="srsa(0)">忘了</button></div>`}
 window.srsa=function(ok){S.srs[a[i].id].next=Date.now()+(ok?7*86400000:3600000);if(!ok)S.wrong.push({type:'srs',id:a[i].id,day:S.day});i++;save();i>=a.length?home():draw()};draw()
}
function mock(){
 let total=40,i=0,score=0,start=Date.now(),limit=25*60;
 let banks=[P2,P34,G,R];
 function draw(){if((Date.now()-start)>limit)return mockEnd(score,total,true);let bank=banks[i%4],q=bank[(S.day*13+i)%bank.length];document.getElementById('app').innerHTML=`<div class="card"><div class="row"><span class="pill">Mini Mock</span><span id="tm">${Math.max(0,Math.ceil((limit-(Date.now()-start))/1000))}s</span></div><p>${i+1}/${total}</p><div class="q">${q[0]}</div>${q[1].map((o,j)=>`<button class="opt" onclick="mansa(${j})">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</div>`;window.mockTick=setInterval(()=>{let left=Math.max(0,Math.ceil((limit-(Date.now()-start))/1000));let e=document.getElementById('tm');if(e)e.textContent=left+'s';if(left<=0){clearInterval(window.mockTick);mockEnd(score,total,true)}},500)}
 window.mansa=function(j){let bank=banks[i%4],q=bank[(S.day*13+i)%bank.length];if(j==q[2])score++;i++;if(i>=total)mockEnd(score,total,false);else draw()}
 function mockEnd(sc,tot,timeout){clearInterval(window.mockTick);S.stats.total+=tot;S.stats.correct+=sc;S.mock.push({day:S.day,score:sc,total:tot,timeout,date:new Date().toISOString()});S.mock=S.mock.slice(-20);S.xp+=50;save();document.getElementById('app').innerHTML=`<div class="card"><h2>${timeout?'时间到！':'Mini Mock 完成'}</h2><div class="big">${sc}/${tot}</div><p>正确率 ${Math.round(sc/tot*100)}%</p><p class="muted">这是训练估计值，不是官方 TOEIC 分数。重点看趋势。</p><button onclick="stats()">查看趋势</button><button class="alt" onclick="home()">首页</button></div>`}
 draw()
}
function stats(){
 let acc=S.stats.total?Math.round(S.stats.correct/S.stats.total*100):0,days=Object.values(S.completed).filter(x=>x.finished).length;
 let hist=S.mock.slice(-8).map((x,i)=>`<div style="padding:7px 0;border-bottom:1px solid #eee">Mock ${i+1} · Day ${x.day} · <b>${x.score}/${x.total}</b> · ${Math.round(x.score/x.total*100)}%</div>`).join('');
 document.getElementById('app').innerHTML=`<div class="card"><h2>成绩中心</h2><div class="grid"><div class="stat"><small>完成</small><div class="big">${days}/90</div></div><div class="stat"><small>正确率</small><div class="big">${acc}%</div></div><div class="stat"><small>XP</small><div class="big">${S.xp}</div></div><div class="stat"><small>错题</small><div class="big">${S.wrong.length}</div></div></div></div>
 <div class="card"><h3>分项训练量</h3><p>P2：${S.stats.p2}　P3/4：${S.stats.p34}</p><p>P5/6：${S.stats.g}　P7：${S.stats.r}　词汇：${S.stats.vocab}</p></div>
 <div class="card"><h3>Mini Mock 趋势</h3>${hist||'<p class="muted">还没有模拟考试记录。</p>'}</div>
 <div class="card"><h3>当前建议</h3><p>${acc<70?'基础阶段：优先词汇和 P5/6，暂时不要盲目刷套题。':acc<82?'强化阶段：增加 P2/P3/4 精听，并开始严格计时。':acc<90?'提分阶段：集中处理错题和阅读速度。':'冲刺阶段：以全套模拟、速度和稳定性为核心。'}</p><button onclick="srs()">SRS复习</button><button class="alt" onclick="exportData()">导出进度</button></div>
 <div class="card"><button class="danger" onclick="resetAll()">重置全部数据</button></div>`
}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='TOEIC830-FINAL-progress.json';a.click()}
function resetAll(){if(confirm('确定删除全部学习记录？')){localStorage.removeItem(KEY);location.reload()}}
